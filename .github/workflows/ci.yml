name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_DOCKER_VERSION: postgres:17-alpine
      REDIS_DOCKER_VERSION: redis:7-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate branch release plan
        if: github.event_name == 'pull_request'
        env:
          RELEASE_PLAN_BRANCH: ${{ github.head_ref }}
        run: pnpm release:plan:check -- --branch "$RELEASE_PLAN_BRANCH" --base origin/dev

      - name: Run repository checks
        run: pnpm check

      - name: Verify validation kept the checkout clean
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code
          test -z "$(git status --short)"
